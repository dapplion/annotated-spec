name: Sync Specs

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check annotated specs are up to date
        run: |
          ./scripts/sync.py
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi
